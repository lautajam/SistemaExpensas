<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantilla - Recibo de Expensas</title>

<style>
    @page {
        size: A5 landscape;
        margin: 0;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #ddd;
        font-family: Georgia, "Times New Roman", serif;
        color: #333;
    }

    .recibo {
        width: 260mm;
        height: 118mm;
        margin: auto;
        position: relative;
        background: #f4f0e4;
        border: 1px solid #777;
        overflow: hidden;
    }

    .marco {
        position: absolute;
        inset: 4mm;
        border: 1px solid #777;
    }

    /* ENCABEZADO */

    .encabezado {
        height: 29mm;
        display: grid;
        grid-template-columns: 36% 39% 25%;
        border-bottom: 1px solid #777;
    }

    .administracion {
        padding: 4mm;
        text-align: center;
        font-size: 11px;
        line-height: 1.25;
    }

    .administracion .titulo {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 3px;
    }

    .administracion .dato {
        margin: 2px 0;
    }

    .titulo-recibo {
        background: #40403d;
        color: #f1eee5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        font-size: 19px;
        font-weight: bold;
        letter-spacing: .5px;
    }

    .datos-superiores {
        display: grid;
        grid-template-columns: 35% 65%;
        grid-template-rows: 50% 50%;
    }

    .datos-superiores > div {
        border-left: 1px solid #777;
        border-bottom: 1px solid #777;
        padding: 2.5mm;
        font-size: 10px;
    }

    /* CUERPO */

    .cuerpo {
        height: calc(100% - 29mm);
        position: relative;
    }

    .fila {
        min-height: 10mm;
        display: grid;
        grid-template-columns: 25% 75%;
        border-bottom: 1px solid rgba(100,100,90,.35);
        align-items: center;
    }

    .etiqueta {
        padding-left: 5mm;
        font-size: 10px;
    }

    .campo {
        min-height: 9mm;
        border-left: 1px solid rgba(100,100,90,.35);
        padding: 2mm 5mm;
        font-size: 15px;
    }

    .concepto {
        height: 31mm;
        padding: 4mm 5mm;
        font-size: 10px;
    }

    .concepto .campo-grande {
        height: 10mm;
        margin-top: 1mm;
        border-bottom: 1px solid rgba(100,100,90,.35);
    }

    .importe-letras {
        margin-top: 4mm;
    }

    .importe-letras .campo-grande {
        height: 13mm;
        border-bottom: 1px solid rgba(100,100,90,.35);
    }

    .fecha {
        height: 11mm;
        display: flex;
        align-items: center;
        padding: 0 5mm;
        font-size: 10px;
        border-top: 1px solid rgba(100,100,90,.35);
    }

    .fecha .campo-fecha {
        margin-left: 10mm;
        width: 55%;
        height: 7mm;
        border-bottom: 1px solid rgba(100,100,90,.35);
    }

    /* PIE */

    .pie {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 18mm;
        border-top: 1px solid #777;
        display: grid;
        grid-template-columns: 45% 35% 20%;
    }

    .recibido {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 7mm 1fr;
        border-right: 1px solid #777;
        font-size: 9px;
    }

    .recibido-titulo {
        grid-column: 1 / 3;
        text-align: center;
        font-weight: bold;
        padding-top: 2mm;
    }

    .recibido-opcion {
        padding: 2mm 4mm;
        border-top: 1px solid rgba(100,100,90,.35);
    }

    .firma {
        border-right: 1px solid #777;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 2mm;
        font-size: 9px;
    }

    .linea-firma {
        width: 65%;
        border-bottom: 1px solid #555;
        margin-bottom: 2mm;
    }

    .sello {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 9px;
    }

    /* CAMPOS */

    [contenteditable="true"] {
        outline: none;
    }

    .placeholder {
        color: #999;
    }

    /* BOTÓN */

    .controles {
        width: 260mm;
        margin: 0 auto 12px;
        font-family: Arial, sans-serif;
    }

    button {
        padding: 8px 14px;
        border: 1px solid #888;
        border-radius: 4px;
        background: white;
        cursor: pointer;
    }

    @media print {
        body {
            padding: 0;
            background: white;
        }

        .controles {
            display: none;
        }

        .recibo {
            margin: 0;
            box-shadow: none;
        }
    }
</style>
</head>

<body>

<div class="controles">
    <button onclick="window.print()">Imprimir / Guardar como PDF</button>
</div>

<div class="recibo">

    <div class="marco">

        <!-- ENCABEZADO -->
        <div class="encabezado">

            <div class="administracion">
                <div class="titulo">Administración</div>

                <div class="dato">
                    <strong contenteditable="true">[NOMBRE DEL CONSORCIO]</strong>
                </div>

                <div class="dato" contenteditable="true">
                    [DIRECCIÓN]
                </div>

                <div class="dato" contenteditable="true">
                    [TELÉFONO / CONTACTO]
                </div>

                <div class="dato" contenteditable="true">
                    Administración de Consorcios
                </div>
            </div>

            <div class="titulo-recibo">
                RECIBO DE EXPENSAS
            </div>

            <div class="datos-superiores">

                <div>N°</div>
                <div contenteditable="true"></div>

                <div>Mes</div>
                <div contenteditable="true"></div>

            </div>

        </div>


        <!-- CUERPO -->
        <div class="cuerpo">

            <div class="fila">
                <div class="etiqueta">Unidad</div>
                <div class="campo" contenteditable="true"></div>
            </div>

            <div class="fila">
                <div class="etiqueta">Mes</div>
                <div class="campo" contenteditable="true"></div>
            </div>


            <div class="concepto">

                <div>Recibí de:</div>

                <div
                    class="campo-grande"
                    contenteditable="true">
                </div>

                <div class="importe-letras">

                    <div>
                        y/o propietarios la cantidad de pesos:
                    </div>

                    <div
                        class="campo-grande"
                        contenteditable="true">
                    </div>

                </div>

            </div>


            <div class="fecha">

                <span>Fecha</span>

                <div
                    class="campo-fecha"
                    contenteditable="true">
                </div>

            </div>


            <!-- PIE -->

            <div class="pie">

                <div class="recibido">

                    <div class="recibido-titulo">
                        RECIBIDO EN:
                    </div>

                    <div
                        class="recibido-opcion"
                        contenteditable="true">
                        EFECTIVO:
                    </div>

                    <div
                        class="recibido-opcion"
                        contenteditable="true">
                        CHEQUE:
                    </div>

                </div>


                <div class="firma">

                    <div class="linea-firma"></div>

                    Firma Administración

                </div>


                <div class="sello">
                    Administración<br>
                    Consorcio
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
